<!doctype html>
<meta charset="utf-8">
<title>blink</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #222; }
  main { padding: 24px; }
  #dot { display: inline-block; width: 2px; height: 20px; background: #000; vertical-align: middle; }
</style>
<main>
  <h1>Small change</h1>
  <p>Only a caret-sized bar changes, twice a second. <span id="dot"></span></p>
</main>
<script>
  const dot = document.getElementById("dot");
  setInterval(() => { dot.style.visibility = dot.style.visibility === "hidden" ? "visible" : "hidden"; }, 500);
</script>
