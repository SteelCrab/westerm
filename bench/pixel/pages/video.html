<!doctype html>
<meta charset="utf-8">
<title>video</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
  // Every pixel changes on every frame, like a video.
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const fit = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
  addEventListener("resize", fit);
  fit();
  let t = 0;
  const draw = () => {
    t += 1;
    const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    g.addColorStop(0, `hsl(${t % 360} 80% 50%)`);
    g.addColorStop(1, `hsl(${(t + 180) % 360} 80% 50%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `hsl(${(t * 3 + i * 9) % 360} 90% 60%)`;
      const x = (Math.sin(t / 30 + i) * 0.5 + 0.5) * canvas.width;
      const y = (Math.cos(t / 37 + i * 1.3) * 0.5 + 0.5) * canvas.height;
      ctx.beginPath();
      ctx.arc(x, y, 30 + (i % 5) * 10, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
</script>
