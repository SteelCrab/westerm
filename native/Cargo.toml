[package]
name = "westerm"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/SteelCrab/westerm"
edition = "2024"
# File::try_lock (host lock)
rust-version = "1.89"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
futures-util = "0.3.34"
libc = "0.2.191"
mime_guess = "2.0.5"
portable-pty = "0.9.0"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
vt100 = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
