[package]
name = "westerm"
version = "0.4.4"
license = "MIT"
repository = "https://github.com/SteelCrab/westerm"
edition = "2024"
# File::try_lock (host lock)
rust-version = "1.89"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
# Kitty graphics payloads that pixel apps send inline.
base64 = "0.22.1"
bytes = "1.12.1"
# zlib payloads (o=z) from pixel apps, and compressed pixel updates for
# remote windows. The default backend is pure Rust.
flate2 = "1.1.11"
futures-util = "0.3.34"
# Settings lists the fonts installed on this computer. Both are pure Rust:
# fontdb finds the font files and names, ttf-parser reads widths and glyphs.
fontdb = "0.24.0"
# Saved pictures get names from the OS random source.
getrandom = "0.3"
# The docs pane lists Markdown files the way git sees them (.gitignore).
ignore = "0.4"
libc = "0.2.191"
mime_guess = "2.0.5"
portable-pty = "0.9.0"
# QUIC to remote westerm hosts. ring, not aws-lc-rs: it builds for musl and
# Windows without cmake. TLS is used only here; downloads still go through curl.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
vt100 = "0.18.1"

# macOS: CoreText names the fonts apps may use, as Font Book shows them.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
# Router tests send requests without a socket.
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
# Windows (MSVC): links the Visual C++ runtime into westerm.exe. A clean
# Windows has no VCRUNTIME140.dll, and westerm.exe would not start there.
static_vcruntime = "3.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
