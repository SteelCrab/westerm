[package]
name = "westerm"
description = "A web terminal whose sessions survive closed tabs, restarts, and reboots"
readme = "README.md"
keywords = ["terminal", "web", "pty", "session"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
include = ["/src/**", "/tests/**", "/build.rs", "/README.md", "/LICENSE", "/web-dist/**"]
version = "0.5.0"
license = "MIT"
repository = "https://github.com/SteelCrab/westerm"
edition = "2024"
# File::try_lock (host lock)
rust-version = "1.89"

[features]
default = ["plugin-db", "plugin-terraform"]
# The Databases plugin (src/plugins/db.rs, src/server/plugins/db/): its
# database drivers and keychain access. Builds without it leave the plugin out.
plugin-db = ["dep:keyring", "dep:sqlx", "dep:tokio-util", "dep:url"]
# The Terraform plugin (src/plugins/terraform.rs, src/plugins/terraform_runner.rs,
# src/server/plugins/terraform/): its HCL parser. Builds without it leave the plugin out.
plugin-terraform = ["dep:hcl-rs", "dep:url"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
# Kitty graphics payloads that pixel apps send inline.
base64 = "0.23.1"
bytes = "1.12.1"
# zlib payloads (o=z) from pixel apps, and compressed pixel updates for
# remote windows. The default backend is pure Rust.
flate2 = "1.1.11"
futures-util = "0.3.34"
# Settings lists the fonts installed on this computer. Both are pure Rust:
# fontdb finds the font files and names, ttf-parser reads widths and glyphs.
fontdb = "0.24.0"
# The tunnel's access code, cookie tokens, and the names of saved pictures
# come from the OS random source.
getrandom = "0.4"
# Reads `.tf` files for the Terraform plugin.
hcl-rs = { version = "0.20", optional = true }
# The Databases plugin keeps passwords in the OS keychain. Linux uses the
# Secret Service over a pure-Rust D-Bus (zbus), so static musl builds work.
keyring = { version = "3.6", optional = true, default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
# Database drivers for the Databases plugin. TLS is rustls with ring, like the
# rest of westerm; SQLite is bundled (built with the musl C compiler on Linux).
sqlx = { version = "0.8.6", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql", "sqlite", "chrono", "uuid", "rust_decimal", "json"] }
tokio-util = { version = "0.7", optional = true, default-features = false }
# Reads DATABASE_URL values the Databases plugin finds (already used by sqlx).
url = { version = "2", optional = true }
# The docs pane lists Markdown files the way git sees them (.gitignore).
ignore = "0.4"
libc = "0.2.191"
mime_guess = "2.0.5"
portable-pty = "0.9.0"
# QUIC to remote westerm hosts. ring, not aws-lc-rs: it builds for musl and
# Windows without cmake. TLS is used only here; downloads still go through curl.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
vt100 = "0.18.1"

# macOS: CoreText names the fonts apps may use, as Font Book shows them.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

[target.'cfg(windows)'.dependencies]
# Diagnostics, Threading, and Wdk read the programs in a shell: their
# command lines, folders, and parents (src/process.rs).
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Router tests send requests without a socket.
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

# The tunnel tests run this file's own binary as a fake cloudflared, so they
# need their own main.
[[test]]
name = "tunnel"
harness = false

[build-dependencies]
# Windows (MSVC): links the Visual C++ runtime into westerm.exe. A clean
# Windows has no VCRUNTIME140.dll, and westerm.exe would not start there.
static_vcruntime = "3.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
