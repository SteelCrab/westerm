name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run that is still going. Runs on
# main are each kept, so every merge gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The UI does not depend on the system, so it is checked once. Its build
  # goes to the Rust jobs: the binary embeds it.
  web:
    name: web (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: node --import tsx --test tests/*.test.ts
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # Each system lints its own code too (cfg(unix), cfg(windows), Linux only).
      # --locked: Cargo.lock must already match Cargo.toml.
      - run: cargo clippy --locked --all-targets --manifest-path native/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path native/Cargo.toml
      # The release build must succeed too (CONTRIBUTING.md); one system is enough.
      - name: Release build
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --locked --manifest-path native/Cargo.toml

  # The install scripts run on users' machines; shellcheck comes with the runner.
  scripts:
    name: scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/*.sh macos/*.sh

  # The macOS app (westerm.app) is otherwise built only at release time.
  macos-app:
    name: macOS app (Swift)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Type-check the app and its build scripts
        run: |
          swiftc -typecheck macos/app/*.swift
          for script in macos/*.swift; do swiftc -typecheck "$script"; done
