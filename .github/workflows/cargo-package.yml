name: Cargo package

on:
  pull_request:
    paths:
      - "native/**"
      - "src/**"
      - "shared/**"
      - "public/**"
      - "scripts/*cargo*.mjs"
      - "tests/cargo-package.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/cargo-package.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Cargo package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: npm ci
      - run: npm run test:cargo
      - run: npm run pack:cargo
      - run: npm run test:cargo-install
